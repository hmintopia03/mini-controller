apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mini-controller
  template:
    metadata:
      labels:
        app: mini-controller
    spec:
      serviceAccountName: mini-controller
      containers:
        - name: mini-controller
          image: mini-controller:0.1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8000

---

apiVersion: v1
kind: Service

metadata:
  name: mini-controller

spec:
  selector:
    app: mini-controller

  ports:
  - port: 8000
    targetPort: 8000