apiVersion: v1
kind: ServiceAccount

metadata:
  name: mini-controller

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: mini-controller

rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs:
    - get
    - list
    - patch

- apiGroups: [""]
  resources: ["pods"]
  verbs:
    - get
    - list
    

--- 

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: mini-controller

subjects:
- kind: ServiceAccount
  name: mini-controller

roleRef:
  kind: Role
  name: mini-controller
  apiGroup: rbac.authorization.k8s.io


---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: mini-controller-namespace-reader

rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs:
    - get
    - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: mini-controller-namespace-reader

subjects:
- kind: ServiceAccount
  name: mini-controller
  namespace: default

roleRef:
  kind: ClusterRole
  name: mini-controller-namespace-reader
  apiGroup: rbac.authorization.k8s.io